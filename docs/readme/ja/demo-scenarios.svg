<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ds-ja-title ds-ja-desc">
  <title id="ds-ja-title">比較の概念図</title>
  <desc id="ds-ja-desc">ターン数、介入、テスト、不要な変更、所要時間を測る。</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .ds-ja-bg{fill:var(--bg)} .ds-ja-card{fill:url(#ds-ja-surface);stroke:var(--line);stroke-width:1} .ds-ja-lead{fill:url(#ds-ja-lead);stroke:var(--line-lead);stroke-width:1} .ds-ja-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .ds-ja-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .ds-ja-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .ds-ja-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .ds-ja-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .ds-ja-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .ds-ja-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .ds-ja-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .ds-ja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:ds-ja-dash 2s linear infinite;marker-end:url(#ds-ja-arrow)} .ds-ja-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ds-ja-quiet-arrow)} .ds-ja-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .ds-ja-shadow{filter:url(#ds-ja-shadow)} .ds-ja-deep{filter:url(#ds-ja-deep)} .ds-ja-glow{filter:url(#ds-ja-glow)} .ds-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes ds-ja-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.ds-ja-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .ds-ja-shadow{filter:url(#ds-ja-shadow-light)} .ds-ja-deep{filter:url(#ds-ja-deep-light)} .ds-ja-glow{filter:url(#ds-ja-glow-light)} .ds-ja-top{display:none}}
  </style>
  <defs>
    <linearGradient id="ds-ja-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="ds-ja-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="ds-ja-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="ds-ja-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="ds-ja-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="ds-ja-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="ds-ja-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="ds-ja-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="ds-ja-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="ds-ja-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="ds-ja-bg" width="960" height="540"/>
  <text class="ds-ja-title" x="32" y="38">比較の概念図</text>
  <text class="ds-ja-sub" x="32" y="60">アプリケーションを固定し、各 IDE で異なる作業方法を試す</text>
  <g><rect class="ds-ja-lead ds-ja-deep ds-ja-glow" x="336" y="176" width="288" height="176" rx="12"/><path class="ds-ja-top" d="M348 177H612"/><text class="ds-ja-name" x="356" y="212">共通基準</text><text class="ds-ja-label" x="356" y="244">同じモデル</text><text class="ds-ja-value" x="356" y="274">同じコミット · 同じテスト</text></g><g><rect class="ds-ja-card ds-ja-shadow" x="32" y="112" width="240" height="128" rx="12"/><path class="ds-ja-top" d="M44 113H260"/><text class="ds-ja-name" x="52" y="148">Kiro</text><text class="ds-ja-label" x="52" y="180">仕様主導のタグ機能</text></g><g><rect class="ds-ja-card ds-ja-shadow" x="688" y="112" width="240" height="128" rx="12"/><path class="ds-ja-top" d="M700 113H916"/><text class="ds-ja-name" x="708" y="148">Copilot</text><text class="ds-ja-label" x="708" y="180">4つのインターフェース</text></g><g><rect class="ds-ja-card ds-ja-shadow" x="32" y="344" width="240" height="128" rx="12"/><path class="ds-ja-top" d="M44 345H260"/><text class="ds-ja-name" x="52" y="380">Antigravity</text><text class="ds-ja-label" x="52" y="412">並列タスク委任</text></g><g><rect class="ds-ja-card ds-ja-shadow" x="688" y="344" width="240" height="128" rx="12"/><path class="ds-ja-top" d="M700 345H916"/><text class="ds-ja-name" x="708" y="380">Junie</text><text class="ds-ja-label" x="708" y="412">JVM ネイティブの3モード</text></g><path class="ds-ja-branch" d="M272 176H320Q328 176 328 184V232Q328 240 336 240"/><path class="ds-ja-branch" d="M624 240H672Q680 240 680 232V176Q680 168 688 168"/><path class="ds-ja-branch" d="M272 408H320Q328 408 328 400V296Q328 288 336 288"/><path class="ds-ja-flow" d="M624 288H640Q648 288 648 296V400Q648 408 656 408H688"/><text class="ds-ja-label" x="32" y="512">ターン数、介入、テスト、不要な変更、所要時間を測る。</text>
</svg>
