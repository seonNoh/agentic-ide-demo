<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="cs-ja-title cs-ja-desc">
  <title id="cs-ja-title">実行時設定</title>
  <desc id="cs-ja-desc">リポジトリ内にプロファイルや環境変数の上書きはない。</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .cs-ja-bg{fill:var(--bg)} .cs-ja-card{fill:url(#cs-ja-surface);stroke:var(--line);stroke-width:1} .cs-ja-lead{fill:url(#cs-ja-lead);stroke:var(--line-lead);stroke-width:1} .cs-ja-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .cs-ja-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .cs-ja-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .cs-ja-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .cs-ja-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .cs-ja-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .cs-ja-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .cs-ja-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .cs-ja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:cs-ja-dash 2s linear infinite;marker-end:url(#cs-ja-arrow)} .cs-ja-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#cs-ja-quiet-arrow)} .cs-ja-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cs-ja-shadow{filter:url(#cs-ja-shadow)} .cs-ja-deep{filter:url(#cs-ja-deep)} .cs-ja-glow{filter:url(#cs-ja-glow)} .cs-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes cs-ja-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.cs-ja-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .cs-ja-shadow{filter:url(#cs-ja-shadow-light)} .cs-ja-deep{filter:url(#cs-ja-deep-light)} .cs-ja-glow{filter:url(#cs-ja-glow-light)} .cs-ja-top{display:none}}
  </style>
  <defs>
    <linearGradient id="cs-ja-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="cs-ja-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="cs-ja-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="cs-ja-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="cs-ja-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="cs-ja-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="cs-ja-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="cs-ja-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="cs-ja-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="cs-ja-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="cs-ja-bg" width="960" height="540"/>
  <text class="cs-ja-title" x="32" y="38">実行時設定</text>
  <text class="cs-ja-sub" x="32" y="60">application.properties が唯一の実行時設定ソースである</text>
  <g><rect class="cs-ja-lead cs-ja-deep cs-ja-glow" x="32" y="176" width="216" height="184" rx="12"/><path class="cs-ja-top" d="M44 177H236"/><text class="cs-ja-name" x="52" y="212">application.properties</text><text class="cs-ja-label" x="52" y="244">src/main/resources</text><text class="cs-ja-value" x="52" y="274">single source</text></g><g><rect class="cs-ja-card cs-ja-shadow" x="304" y="104" width="288" height="136" rx="12"/><path class="cs-ja-top" d="M316 105H580"/><text class="cs-ja-name" x="324" y="140">識別子とポート</text><text class="cs-ja-value" x="324" y="172">spring.application.name</text><text class="cs-ja-value" x="324" y="202">server.port = 8090</text></g><g><rect class="cs-ja-card cs-ja-shadow" x="640" y="104" width="288" height="136" rx="12"/><path class="cs-ja-top" d="M652 105H916"/><text class="cs-ja-name" x="660" y="140">データソース</text><text class="cs-ja-value" x="660" y="172">spring.datasource.url</text><text class="cs-ja-value" x="660" y="202">driver · username · password</text></g><g><rect class="cs-ja-card cs-ja-shadow" x="304" y="288" width="288" height="136" rx="12"/><path class="cs-ja-top" d="M316 289H580"/><text class="cs-ja-name" x="324" y="324">JPA のライフサイクル</text><text class="cs-ja-value" x="324" y="356">ddl-auto = create-drop</text><text class="cs-ja-value" x="324" y="386">open-in-view = false</text></g><g><rect class="cs-ja-card cs-ja-shadow" x="640" y="288" width="288" height="136" rx="12"/><path class="cs-ja-top" d="M652 289H916"/><text class="cs-ja-name" x="660" y="324">初期化</text><text class="cs-ja-value" x="660" y="356">初期化を遅延 = true</text><text class="cs-ja-value" x="660" y="386">sql.init.mode = always</text></g><path class="cs-ja-flow" d="M248 208H264Q272 208 272 200V172Q272 164 280 164H304"/><path class="cs-ja-call" d="M248 248H600Q608 248 608 240V204Q608 196 616 196H640"/><path class="cs-ja-call" d="M248 328H264Q272 328 272 336V356Q272 364 280 364H304"/><path class="cs-ja-call" d="M248 288H256Q264 288 264 280H600Q608 280 608 288V348Q608 356 616 356H640"/><text class="cs-ja-label" x="32" y="500">リポジトリ内にプロファイルや環境変数の上書きはない。</text>
</svg>
