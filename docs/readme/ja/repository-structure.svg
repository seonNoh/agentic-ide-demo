<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rs-ja-title rs-ja-desc">
  <title id="rs-ja-title">リポジトリ構成</title>
  <desc id="rs-ja-desc">README_STRUCTURE.md と保存した原文が文書契約を記録する。</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .rs-ja-bg{fill:var(--bg)} .rs-ja-card{fill:url(#rs-ja-surface);stroke:var(--line);stroke-width:1} .rs-ja-lead{fill:url(#rs-ja-lead);stroke:var(--line-lead);stroke-width:1} .rs-ja-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .rs-ja-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .rs-ja-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .rs-ja-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rs-ja-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .rs-ja-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rs-ja-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .rs-ja-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .rs-ja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rs-ja-dash 2s linear infinite;marker-end:url(#rs-ja-arrow)} .rs-ja-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#rs-ja-quiet-arrow)} .rs-ja-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .rs-ja-shadow{filter:url(#rs-ja-shadow)} .rs-ja-deep{filter:url(#rs-ja-deep)} .rs-ja-glow{filter:url(#rs-ja-glow)} .rs-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes rs-ja-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.rs-ja-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .rs-ja-shadow{filter:url(#rs-ja-shadow-light)} .rs-ja-deep{filter:url(#rs-ja-deep-light)} .rs-ja-glow{filter:url(#rs-ja-glow-light)} .rs-ja-top{display:none}}
  </style>
  <defs>
    <linearGradient id="rs-ja-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="rs-ja-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="rs-ja-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="rs-ja-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="rs-ja-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="rs-ja-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rs-ja-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rs-ja-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="rs-ja-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="rs-ja-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="rs-ja-bg" width="960" height="540"/>
  <text class="rs-ja-title" x="32" y="38">リポジトリ構成</text>
  <text class="rs-ja-sub" x="32" y="60">本番コード、リソース、テスト、運用メタデータを分けている</text>
  <g><rect class="rs-ja-lead rs-ja-deep rs-ja-glow" x="328" y="96" width="304" height="120" rx="12"/><path class="rs-ja-top" d="M340 97H620"/><text class="rs-ja-name" x="348" y="132">リポジトリルート</text><text class="rs-ja-value" x="348" y="164">Gradle wrapper · settings</text><text class="rs-ja-label" x="348" y="194">README · デモスクリプト</text></g><g><rect class="rs-ja-card rs-ja-shadow" x="32" y="304" width="208" height="144" rx="12"/><path class="rs-ja-top" d="M44 305H228"/><text class="rs-ja-name" x="52" y="340">Kotlin アプリケーション</text><text class="rs-ja-value" x="52" y="372">src/main/kotlin</text><text class="rs-ja-label" x="52" y="402">note · stats パッケージ</text></g><g><rect class="rs-ja-card rs-ja-shadow" x="264" y="304" width="208" height="144" rx="12"/><path class="rs-ja-top" d="M276 305H460"/><text class="rs-ja-name" x="284" y="340">実行時リソース</text><text class="rs-ja-value" x="284" y="372">src/main/resources</text><text class="rs-ja-label" x="284" y="402">properties · SQL · templates</text></g><g><rect class="rs-ja-card rs-ja-shadow" x="496" y="304" width="208" height="144" rx="12"/><path class="rs-ja-top" d="M508 305H692"/><text class="rs-ja-name" x="516" y="340">テスト範囲</text><text class="rs-ja-value" x="516" y="372">src/test/kotlin</text><text class="rs-ja-label" x="516" y="402">context · service · API</text></g><g><rect class="rs-ja-card rs-ja-shadow" x="728" y="304" width="200" height="144" rx="12"/><path class="rs-ja-top" d="M740 305H916"/><text class="rs-ja-name" x="748" y="340">リポジトリ運用</text><text class="rs-ja-value" x="748" y="372">gitea-settings.json</text><text class="rs-ja-label" x="748" y="402">.gitea · 検証スクリプト</text></g><path class="rs-ja-branch" d="M480 216V256"/><path class="rs-ja-branch" d="M136 280V296Q136 304 144 304"/><path class="rs-ja-branch" d="M368 280V304"/><path class="rs-ja-branch" d="M600 280V304"/><path class="rs-ja-branch" d="M832 280V296Q832 304 824 304"/><path class="rs-ja-branch" d="M136 280H832"/><text class="rs-ja-label" x="32" y="500">README_STRUCTURE.md と保存した原文が文書契約を記録する。</text>
</svg>
