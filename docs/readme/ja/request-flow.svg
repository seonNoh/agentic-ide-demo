<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rf-ja-title rf-ja-desc">
  <title id="rf-ja-title">ノートのリクエストフロー</title>
  <desc id="rf-ja-desc">選択したコントローラから HTML 画面または JSON 応答を返す。</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .rf-ja-bg{fill:var(--bg)} .rf-ja-card{fill:url(#rf-ja-surface);stroke:var(--line);stroke-width:1} .rf-ja-lead{fill:url(#rf-ja-lead);stroke:var(--line-lead);stroke-width:1} .rf-ja-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .rf-ja-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .rf-ja-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .rf-ja-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rf-ja-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .rf-ja-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rf-ja-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .rf-ja-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .rf-ja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rf-ja-dash 2s linear infinite;marker-end:url(#rf-ja-arrow)} .rf-ja-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#rf-ja-quiet-arrow)} .rf-ja-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .rf-ja-shadow{filter:url(#rf-ja-shadow)} .rf-ja-deep{filter:url(#rf-ja-deep)} .rf-ja-glow{filter:url(#rf-ja-glow)} .rf-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes rf-ja-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.rf-ja-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .rf-ja-shadow{filter:url(#rf-ja-shadow-light)} .rf-ja-deep{filter:url(#rf-ja-deep-light)} .rf-ja-glow{filter:url(#rf-ja-glow-light)} .rf-ja-top{display:none}}
  </style>
  <defs>
    <linearGradient id="rf-ja-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="rf-ja-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="rf-ja-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="rf-ja-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="rf-ja-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="rf-ja-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rf-ja-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rf-ja-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="rf-ja-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="rf-ja-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="rf-ja-bg" width="960" height="540"/>
  <text class="rf-ja-title" x="32" y="38">ノートのリクエストフロー</text>
  <text class="rf-ja-sub" x="32" y="60">HTML フォームと JSON 呼び出しは同じトランザクション境界を共有する</text>
  <g><rect class="rf-ja-card rf-ja-shadow" x="32" y="120" width="160" height="136" rx="12"/><path class="rf-ja-top" d="M44 121H180"/><text class="rf-ja-name" x="52" y="156">ブラウザ</text><text class="rf-ja-value" x="52" y="188">HTML フォーム</text></g><g><rect class="rf-ja-card rf-ja-shadow" x="32" y="304" width="160" height="136" rx="12"/><path class="rf-ja-top" d="M44 305H180"/><text class="rf-ja-name" x="52" y="340">JSON クライアント</text><text class="rf-ja-value" x="52" y="372">REST ボディ</text></g><g><rect class="rf-ja-card rf-ja-shadow" x="232" y="176" width="176" height="208" rx="12"/><path class="rf-ja-top" d="M244 177H396"/><text class="rf-ja-name" x="252" y="212">コントローラ</text><text class="rf-ja-value" x="252" y="244">NoteController</text><text class="rf-ja-label" x="252" y="274">NoteApiController</text></g><g><rect class="rf-ja-lead rf-ja-deep rf-ja-glow" x="448" y="176" width="176" height="208" rx="12"/><path class="rf-ja-top" d="M460 177H612"/><text class="rf-ja-name" x="468" y="212">サービス</text><text class="rf-ja-value" x="468" y="244">NoteService</text><text class="rf-ja-label" x="468" y="274">検証 · 並び替え</text><text class="rf-ja-label" x="468" y="304">作成 · 更新 · 削除</text></g><g><rect class="rf-ja-card rf-ja-shadow" x="656" y="176" width="144" height="208" rx="12"/><path class="rf-ja-top" d="M668 177H788"/><text class="rf-ja-name" x="676" y="212">リポジトリ</text><text class="rf-ja-value" x="676" y="244">NoteRepository</text><text class="rf-ja-label" x="676" y="274">Spring Data JPA</text></g><g><rect class="rf-ja-card rf-ja-shadow" x="832" y="176" width="96" height="208" rx="12"/><path class="rf-ja-top" d="M844 177H916"/><text class="rf-ja-name" x="852" y="212">H2 データ</text><text class="rf-ja-value" x="852" y="244">H2</text><text class="rf-ja-label" x="852" y="274">data.sql</text></g><path class="rf-ja-call" d="M192 188H200Q208 188 208 196V248Q208 256 216 256H232"/><path class="rf-ja-call" d="M192 372H200Q208 372 208 364V312Q208 304 216 304H232"/><path class="rf-ja-flow" d="M408 280H448"/><path class="rf-ja-call" d="M624 280H656"/><path class="rf-ja-call" d="M800 280H832"/><text class="rf-ja-label" x="32" y="500">選択したコントローラから HTML 画面または JSON 応答を返す。</text>
</svg>
