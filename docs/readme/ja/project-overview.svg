<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="po-ja-title po-ja-desc">
  <title id="po-ja-title">プロジェクト概要</title>
  <desc id="po-ja-desc">コードとテストを固定し、エージェントハーネスの動作差を切り分ける。</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .po-ja-bg{fill:var(--bg)} .po-ja-card{fill:url(#po-ja-surface);stroke:var(--line);stroke-width:1} .po-ja-lead{fill:url(#po-ja-lead);stroke:var(--line-lead);stroke-width:1} .po-ja-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .po-ja-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .po-ja-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .po-ja-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .po-ja-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .po-ja-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .po-ja-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .po-ja-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .po-ja-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:po-ja-dash 2s linear infinite;marker-end:url(#po-ja-arrow)} .po-ja-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#po-ja-quiet-arrow)} .po-ja-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .po-ja-shadow{filter:url(#po-ja-shadow)} .po-ja-deep{filter:url(#po-ja-deep)} .po-ja-glow{filter:url(#po-ja-glow)} .po-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes po-ja-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.po-ja-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .po-ja-shadow{filter:url(#po-ja-shadow-light)} .po-ja-deep{filter:url(#po-ja-deep-light)} .po-ja-glow{filter:url(#po-ja-glow-light)} .po-ja-top{display:none}}
  </style>
  <defs>
    <linearGradient id="po-ja-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="po-ja-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="po-ja-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="po-ja-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="po-ja-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="po-ja-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="po-ja-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="po-ja-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="po-ja-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="po-ja-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="po-ja-bg" width="960" height="540"/>
  <text class="po-ja-title" x="32" y="38">プロジェクト概要</text>
  <text class="po-ja-sub" x="32" y="60">1つの安定したノートアプリで4つのエージェントハーネスを比べる</text>
  <g><rect class="po-ja-lead po-ja-deep po-ja-glow" x="288" y="176" width="384" height="168" rx="12"/><path class="po-ja-top" d="M300 177H660"/><text class="po-ja-name" x="308" y="212">共通アプリケーション</text><text class="po-ja-value" x="308" y="244">Kotlin + Spring Boot</text><text class="po-ja-label" x="308" y="274">ノート、統計、HTML、JSON</text></g><g><rect class="po-ja-card po-ja-shadow" x="32" y="112" width="224" height="112" rx="12"/><path class="po-ja-top" d="M44 113H244"/><text class="po-ja-name" x="52" y="148">実行環境</text><text class="po-ja-value" x="52" y="180">Java 21 · ポート 8090</text></g><g><rect class="po-ja-card po-ja-shadow" x="704" y="112" width="224" height="112" rx="12"/><path class="po-ja-top" d="M716 113H916"/><text class="po-ja-name" x="724" y="148">インターフェース</text><text class="po-ja-value" x="724" y="180">Thymeleaf · REST</text></g><g><rect class="po-ja-card po-ja-shadow" x="32" y="360" width="224" height="112" rx="12"/><path class="po-ja-top" d="M44 361H244"/><text class="po-ja-name" x="52" y="396">データ</text><text class="po-ja-value" x="52" y="428">JPA · H2 メモリ</text></g><g><rect class="po-ja-card po-ja-shadow" x="704" y="360" width="224" height="112" rx="12"/><path class="po-ja-top" d="M716 361H916"/><text class="po-ja-name" x="724" y="396">比較条件</text><text class="po-ja-value" x="724" y="428">同じモデル · 4つの IDE</text></g><path class="po-ja-flow" d="M256 200H288"/><path class="po-ja-flow" d="M672 320H676Q680 320 680 324V380Q680 384 684 384H704"/><text class="po-ja-label" x="32" y="500">コードとテストを固定し、エージェントハーネスの動作差を切り分ける。</text>
</svg>
