<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rs-ko-title rs-ko-desc">
  <title id="rs-ko-title">저장소 구조</title>
  <desc id="rs-ko-desc">README_STRUCTURE.md와 보존한 원문이 문서 계약을 기록한다.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .rs-ko-bg{fill:var(--bg)} .rs-ko-card{fill:url(#rs-ko-surface);stroke:var(--line);stroke-width:1} .rs-ko-lead{fill:url(#rs-ko-lead);stroke:var(--line-lead);stroke-width:1} .rs-ko-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .rs-ko-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .rs-ko-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .rs-ko-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rs-ko-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .rs-ko-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rs-ko-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .rs-ko-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .rs-ko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rs-ko-dash 2s linear infinite;marker-end:url(#rs-ko-arrow)} .rs-ko-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#rs-ko-quiet-arrow)} .rs-ko-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .rs-ko-shadow{filter:url(#rs-ko-shadow)} .rs-ko-deep{filter:url(#rs-ko-deep)} .rs-ko-glow{filter:url(#rs-ko-glow)} .rs-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes rs-ko-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.rs-ko-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .rs-ko-shadow{filter:url(#rs-ko-shadow-light)} .rs-ko-deep{filter:url(#rs-ko-deep-light)} .rs-ko-glow{filter:url(#rs-ko-glow-light)} .rs-ko-top{display:none}}
  </style>
  <defs>
    <linearGradient id="rs-ko-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="rs-ko-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="rs-ko-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="rs-ko-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="rs-ko-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="rs-ko-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rs-ko-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rs-ko-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="rs-ko-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="rs-ko-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="rs-ko-bg" width="960" height="540"/>
  <text class="rs-ko-title" x="32" y="38">저장소 구조</text>
  <text class="rs-ko-sub" x="32" y="60">운영 코드, 리소스, 테스트, 저장소 설정을 분리해 둔다</text>
  <g><rect class="rs-ko-lead rs-ko-deep rs-ko-glow" x="328" y="96" width="304" height="120" rx="12"/><path class="rs-ko-top" d="M340 97H620"/><text class="rs-ko-name" x="348" y="132">저장소 루트</text><text class="rs-ko-value" x="348" y="164">Gradle wrapper · settings</text><text class="rs-ko-label" x="348" y="194">README · 데모 스크립트</text></g><g><rect class="rs-ko-card rs-ko-shadow" x="32" y="304" width="208" height="144" rx="12"/><path class="rs-ko-top" d="M44 305H228"/><text class="rs-ko-name" x="52" y="340">Kotlin 애플리케이션</text><text class="rs-ko-value" x="52" y="372">src/main/kotlin</text><text class="rs-ko-label" x="52" y="402">note · stats 패키지</text></g><g><rect class="rs-ko-card rs-ko-shadow" x="264" y="304" width="208" height="144" rx="12"/><path class="rs-ko-top" d="M276 305H460"/><text class="rs-ko-name" x="284" y="340">런타임 리소스</text><text class="rs-ko-value" x="284" y="372">src/main/resources</text><text class="rs-ko-label" x="284" y="402">properties · SQL · templates</text></g><g><rect class="rs-ko-card rs-ko-shadow" x="496" y="304" width="208" height="144" rx="12"/><path class="rs-ko-top" d="M508 305H692"/><text class="rs-ko-name" x="516" y="340">테스트 범위</text><text class="rs-ko-value" x="516" y="372">src/test/kotlin</text><text class="rs-ko-label" x="516" y="402">context · service · API</text></g><g><rect class="rs-ko-card rs-ko-shadow" x="728" y="304" width="200" height="144" rx="12"/><path class="rs-ko-top" d="M740 305H916"/><text class="rs-ko-name" x="748" y="340">저장소 운영</text><text class="rs-ko-value" x="748" y="372">gitea-settings.json</text><text class="rs-ko-label" x="748" y="402">.gitea · 검증기</text></g><path class="rs-ko-branch" d="M480 216V280"/><path class="rs-ko-branch" d="M136 280V304"/><path class="rs-ko-branch" d="M368 280V304"/><path class="rs-ko-branch" d="M600 280V304"/><path class="rs-ko-branch" d="M832 280V304"/><path class="rs-ko-branch" d="M136 280H832"/><text class="rs-ko-label" x="32" y="500">README_STRUCTURE.md와 보존한 원문이 문서 계약을 기록한다.</text>
</svg>
