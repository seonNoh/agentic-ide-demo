<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="cs-ko-title cs-ko-desc">
  <title id="cs-ko-title">런타임 설정</title>
  <desc id="cs-ko-desc">저장소에는 프로파일이나 환경 변수 재정의가 없다.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .cs-ko-bg{fill:var(--bg)} .cs-ko-card{fill:url(#cs-ko-surface);stroke:var(--line);stroke-width:1} .cs-ko-lead{fill:url(#cs-ko-lead);stroke:var(--line-lead);stroke-width:1} .cs-ko-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .cs-ko-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .cs-ko-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .cs-ko-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .cs-ko-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .cs-ko-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .cs-ko-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .cs-ko-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .cs-ko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:cs-ko-dash 2s linear infinite;marker-end:url(#cs-ko-arrow)} .cs-ko-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#cs-ko-quiet-arrow)} .cs-ko-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .cs-ko-shadow{filter:url(#cs-ko-shadow)} .cs-ko-deep{filter:url(#cs-ko-deep)} .cs-ko-glow{filter:url(#cs-ko-glow)} .cs-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes cs-ko-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.cs-ko-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .cs-ko-shadow{filter:url(#cs-ko-shadow-light)} .cs-ko-deep{filter:url(#cs-ko-deep-light)} .cs-ko-glow{filter:url(#cs-ko-glow-light)} .cs-ko-top{display:none}}
  </style>
  <defs>
    <linearGradient id="cs-ko-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="cs-ko-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="cs-ko-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="cs-ko-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="cs-ko-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="cs-ko-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="cs-ko-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="cs-ko-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="cs-ko-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="cs-ko-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="cs-ko-bg" width="960" height="540"/>
  <text class="cs-ko-title" x="32" y="38">런타임 설정</text>
  <text class="cs-ko-sub" x="32" y="60">application.properties가 유일한 런타임 설정 원본이다</text>
  <g><rect class="cs-ko-lead cs-ko-deep cs-ko-glow" x="32" y="176" width="216" height="184" rx="12"/><path class="cs-ko-top" d="M44 177H236"/><text class="cs-ko-name" x="52" y="212">application.properties</text><text class="cs-ko-label" x="52" y="244">src/main/resources</text><text class="cs-ko-value" x="52" y="274">single source</text></g><g><rect class="cs-ko-card cs-ko-shadow" x="304" y="104" width="288" height="136" rx="12"/><path class="cs-ko-top" d="M316 105H580"/><text class="cs-ko-name" x="324" y="140">식별자와 포트</text><text class="cs-ko-value" x="324" y="172">spring.application.name</text><text class="cs-ko-value" x="324" y="202">server.port = 8090</text></g><g><rect class="cs-ko-card cs-ko-shadow" x="640" y="104" width="288" height="136" rx="12"/><path class="cs-ko-top" d="M652 105H916"/><text class="cs-ko-name" x="660" y="140">데이터소스</text><text class="cs-ko-value" x="660" y="172">spring.datasource.url</text><text class="cs-ko-value" x="660" y="202">driver · username · password</text></g><g><rect class="cs-ko-card cs-ko-shadow" x="304" y="288" width="288" height="136" rx="12"/><path class="cs-ko-top" d="M316 289H580"/><text class="cs-ko-name" x="324" y="324">JPA 수명주기</text><text class="cs-ko-value" x="324" y="356">ddl-auto = create-drop</text><text class="cs-ko-value" x="324" y="386">open-in-view = false</text></g><g><rect class="cs-ko-card cs-ko-shadow" x="640" y="288" width="288" height="136" rx="12"/><path class="cs-ko-top" d="M652 289H916"/><text class="cs-ko-name" x="660" y="324">초기화</text><text class="cs-ko-value" x="660" y="356">초기화를 뒤로 미룸 = true</text><text class="cs-ko-value" x="660" y="386">sql.init.mode = always</text></g><path class="cs-ko-flow" d="M248 268H272Q280 268 280 260V172Q280 164 288 164H304"/><path class="cs-ko-branch" d="M280 268H616Q624 268 624 260V172Q624 164 640 164"/><path class="cs-ko-branch" d="M280 268V356Q280 364 288 364H304"/><path class="cs-ko-branch" d="M280 268H616Q624 268 624 276V356Q624 364 640 364"/><text class="cs-ko-label" x="32" y="500">저장소에는 프로파일이나 환경 변수 재정의가 없다.</text>
</svg>
