<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="aa-ko-title aa-ko-desc">
  <title id="aa-ko-title">애플리케이션 아키텍처</title>
  <desc id="aa-ko-desc">배포 매니페스트는 없으며 Gradle bootRun이 로컬 단일 프로세스를 시작한다.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .aa-ko-bg{fill:var(--bg)} .aa-ko-card{fill:url(#aa-ko-surface);stroke:var(--line);stroke-width:1} .aa-ko-lead{fill:url(#aa-ko-lead);stroke:var(--line-lead);stroke-width:1} .aa-ko-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .aa-ko-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .aa-ko-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .aa-ko-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .aa-ko-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .aa-ko-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .aa-ko-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .aa-ko-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .aa-ko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:aa-ko-dash 2s linear infinite;marker-end:url(#aa-ko-arrow)} .aa-ko-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#aa-ko-quiet-arrow)} .aa-ko-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .aa-ko-shadow{filter:url(#aa-ko-shadow)} .aa-ko-deep{filter:url(#aa-ko-deep)} .aa-ko-glow{filter:url(#aa-ko-glow)} .aa-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes aa-ko-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.aa-ko-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .aa-ko-shadow{filter:url(#aa-ko-shadow-light)} .aa-ko-deep{filter:url(#aa-ko-deep-light)} .aa-ko-glow{filter:url(#aa-ko-glow-light)} .aa-ko-top{display:none}}
  </style>
  <defs>
    <linearGradient id="aa-ko-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="aa-ko-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="aa-ko-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="aa-ko-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="aa-ko-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="aa-ko-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="aa-ko-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="aa-ko-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="aa-ko-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="aa-ko-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="aa-ko-bg" width="960" height="540"/>
  <text class="aa-ko-title" x="32" y="38">애플리케이션 아키텍처</text>
  <text class="aa-ko-sub" x="32" y="60">하나의 Spring Boot 프로세스가 UI, REST, 통계, 임시 데이터를 제공한다</text>
  <g><rect class="aa-ko-card aa-ko-shadow" x="32" y="176" width="168" height="192" rx="12"/><path class="aa-ko-top" d="M44 177H188"/><text class="aa-ko-name" x="52" y="212">클라이언트</text><text class="aa-ko-label" x="52" y="244">브라우저</text><text class="aa-ko-label" x="52" y="274">JSON 호출자</text><text class="aa-ko-value" x="52" y="304">HTTP :8090</text></g><g><rect class="aa-ko-card aa-ko-shadow" x="232" y="144" width="232" height="256" rx="12"/><path class="aa-ko-top" d="M244 145H452"/><text class="aa-ko-name" x="252" y="180">웹 어댑터</text><text class="aa-ko-value" x="252" y="212">NoteController</text><text class="aa-ko-label" x="252" y="242">NoteApiController</text><text class="aa-ko-label" x="252" y="272">StatsController</text></g><g><rect class="aa-ko-lead aa-ko-deep aa-ko-glow" x="496" y="144" width="200" height="256" rx="12"/><path class="aa-ko-top" d="M508 145H684"/><text class="aa-ko-name" x="516" y="180">애플리케이션 서비스</text><text class="aa-ko-value" x="516" y="212">NoteService</text><text class="aa-ko-label" x="516" y="242">StatsService</text></g><g><rect class="aa-ko-card aa-ko-shadow" x="728" y="176" width="200" height="192" rx="12"/><path class="aa-ko-top" d="M740 177H916"/><text class="aa-ko-name" x="748" y="212">영속성 어댑터</text><text class="aa-ko-value" x="748" y="244">NoteRepository</text><text class="aa-ko-label" x="748" y="274">Spring Data JPA</text></g><path class="aa-ko-flow" d="M200 272H232"/><path class="aa-ko-call" d="M464 272H496"/><path class="aa-ko-flow" d="M696 272H728"/><rect class="aa-ko-inner" x="760" y="288" width="136" height="64" rx="8"/><text class="aa-ko-value" x="776" y="316">H2 메모리</text><text class="aa-ko-label" x="776" y="340">data.sql 시드</text><text class="aa-ko-label" x="32" y="500">배포 매니페스트는 없으며 Gradle bootRun이 로컬 단일 프로세스를 시작한다.</text>
</svg>
