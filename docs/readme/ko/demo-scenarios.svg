<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ds-ko-title ds-ko-desc">
  <title id="ds-ko-title">비교 개념도</title>
  <desc id="ds-ko-desc">턴 수, 개입, 테스트, 불필요한 변경, 시간을 측정한다.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .ds-ko-bg{fill:var(--bg)} .ds-ko-card{fill:url(#ds-ko-surface);stroke:var(--line);stroke-width:1} .ds-ko-lead{fill:url(#ds-ko-lead);stroke:var(--line-lead);stroke-width:1} .ds-ko-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .ds-ko-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .ds-ko-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .ds-ko-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .ds-ko-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .ds-ko-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .ds-ko-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .ds-ko-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .ds-ko-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:ds-ko-dash 2s linear infinite;marker-end:url(#ds-ko-arrow)} .ds-ko-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ds-ko-quiet-arrow)} .ds-ko-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .ds-ko-shadow{filter:url(#ds-ko-shadow)} .ds-ko-deep{filter:url(#ds-ko-deep)} .ds-ko-glow{filter:url(#ds-ko-glow)} .ds-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes ds-ko-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.ds-ko-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .ds-ko-shadow{filter:url(#ds-ko-shadow-light)} .ds-ko-deep{filter:url(#ds-ko-deep-light)} .ds-ko-glow{filter:url(#ds-ko-glow-light)} .ds-ko-top{display:none}}
  </style>
  <defs>
    <linearGradient id="ds-ko-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="ds-ko-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="ds-ko-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="ds-ko-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="ds-ko-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="ds-ko-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="ds-ko-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="ds-ko-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="ds-ko-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="ds-ko-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="ds-ko-bg" width="960" height="540"/>
  <text class="ds-ko-title" x="32" y="38">비교 개념도</text>
  <text class="ds-ko-sub" x="32" y="60">애플리케이션은 고정하고 각 IDE가 서로 다른 작업 방식을 실행한다</text>
  <g><rect class="ds-ko-lead ds-ko-deep ds-ko-glow" x="336" y="176" width="288" height="176" rx="12"/><path class="ds-ko-top" d="M348 177H612"/><text class="ds-ko-name" x="356" y="212">공통 기준</text><text class="ds-ko-label" x="356" y="244">동일 모델</text><text class="ds-ko-value" x="356" y="274">동일 커밋 · 동일 테스트</text></g><g><rect class="ds-ko-card ds-ko-shadow" x="32" y="112" width="240" height="128" rx="12"/><path class="ds-ko-top" d="M44 113H260"/><text class="ds-ko-name" x="52" y="148">Kiro</text><text class="ds-ko-label" x="52" y="180">명세 주도 태그 기능</text></g><g><rect class="ds-ko-card ds-ko-shadow" x="688" y="112" width="240" height="128" rx="12"/><path class="ds-ko-top" d="M700 113H916"/><text class="ds-ko-name" x="708" y="148">Copilot</text><text class="ds-ko-label" x="708" y="180">네 가지 인터페이스</text></g><g><rect class="ds-ko-card ds-ko-shadow" x="32" y="344" width="240" height="128" rx="12"/><path class="ds-ko-top" d="M44 345H260"/><text class="ds-ko-name" x="52" y="380">Antigravity</text><text class="ds-ko-label" x="52" y="412">병렬 작업 위임</text></g><g><rect class="ds-ko-card ds-ko-shadow" x="688" y="344" width="240" height="128" rx="12"/><path class="ds-ko-top" d="M700 345H916"/><text class="ds-ko-name" x="708" y="380">Junie</text><text class="ds-ko-label" x="708" y="412">JVM 네이티브 세 모드</text></g><path class="ds-ko-branch" d="M272 176H320Q328 176 328 184V232Q328 240 336 240"/><path class="ds-ko-branch" d="M624 240H672Q680 240 680 232V176Q680 168 688 168"/><path class="ds-ko-branch" d="M272 408H320Q328 408 328 400V296Q328 288 336 288"/><path class="ds-ko-flow" d="M624 288H640Q648 288 648 296V400Q648 408 656 408H688"/><text class="ds-ko-label" x="32" y="512">턴 수, 개입, 테스트, 불필요한 변경, 시간을 측정한다.</text>
</svg>
