<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rf-en-title rf-en-desc">
  <title id="rf-en-title">Note request flow</title>
  <desc id="rf-en-desc">HTML view or JSON response returns through the selected controller.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .rf-en-bg{fill:var(--bg)} .rf-en-card{fill:url(#rf-en-surface);stroke:var(--line);stroke-width:1} .rf-en-lead{fill:url(#rf-en-lead);stroke:var(--line-lead);stroke-width:1} .rf-en-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .rf-en-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .rf-en-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .rf-en-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rf-en-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .rf-en-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .rf-en-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .rf-en-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .rf-en-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rf-en-dash 2s linear infinite;marker-end:url(#rf-en-arrow)} .rf-en-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#rf-en-quiet-arrow)} .rf-en-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .rf-en-shadow{filter:url(#rf-en-shadow)} .rf-en-deep{filter:url(#rf-en-deep)} .rf-en-glow{filter:url(#rf-en-glow)} .rf-en-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes rf-en-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.rf-en-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .rf-en-shadow{filter:url(#rf-en-shadow-light)} .rf-en-deep{filter:url(#rf-en-deep-light)} .rf-en-glow{filter:url(#rf-en-glow-light)} .rf-en-top{display:none}}
  </style>
  <defs>
    <linearGradient id="rf-en-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="rf-en-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="rf-en-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="rf-en-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="rf-en-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="rf-en-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rf-en-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="rf-en-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="rf-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="rf-en-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="rf-en-bg" width="960" height="540"/>
  <text class="rf-en-title" x="32" y="38">Note request flow</text>
  <text class="rf-en-sub" x="32" y="60">HTML forms and JSON calls share the same transactional service boundary</text>
  <g><rect class="rf-en-card rf-en-shadow" x="32" y="120" width="160" height="136" rx="12"/><path class="rf-en-top" d="M44 121H180"/><text class="rf-en-name" x="52" y="156">Browser</text><text class="rf-en-value" x="52" y="188">HTML form</text></g><g><rect class="rf-en-card rf-en-shadow" x="32" y="304" width="160" height="136" rx="12"/><path class="rf-en-top" d="M44 305H180"/><text class="rf-en-name" x="52" y="340">JSON client</text><text class="rf-en-value" x="52" y="372">REST body</text></g><g><rect class="rf-en-card rf-en-shadow" x="232" y="176" width="176" height="208" rx="12"/><path class="rf-en-top" d="M244 177H396"/><text class="rf-en-name" x="252" y="212">Controllers</text><text class="rf-en-value" x="252" y="244">NoteController</text><text class="rf-en-label" x="252" y="274">NoteApiController</text></g><g><rect class="rf-en-lead rf-en-deep rf-en-glow" x="448" y="176" width="176" height="208" rx="12"/><path class="rf-en-top" d="M460 177H612"/><text class="rf-en-name" x="468" y="212">Service</text><text class="rf-en-value" x="468" y="244">NoteService</text><text class="rf-en-label" x="468" y="274">validate · order · mutate</text></g><g><rect class="rf-en-card rf-en-shadow" x="664" y="176" width="128" height="208" rx="12"/><path class="rf-en-top" d="M676 177H780"/><text class="rf-en-name" x="684" y="212">Repository</text><text class="rf-en-value" x="684" y="244">NoteRepository</text><text class="rf-en-label" x="684" y="274">Spring Data JPA</text></g><g><rect class="rf-en-card rf-en-shadow" x="832" y="176" width="96" height="208" rx="12"/><path class="rf-en-top" d="M844 177H916"/><text class="rf-en-name" x="852" y="212">H2 data</text><text class="rf-en-value" x="852" y="244">H2</text><text class="rf-en-label" x="852" y="274">data.sql</text></g><path class="rf-en-call" d="M192 188H216Q224 188 224 196V248Q224 256 232 256"/><path class="rf-en-call" d="M192 372H216Q224 372 224 364V312Q224 304 232 304"/><path class="rf-en-flow" d="M408 280H448"/><path class="rf-en-call" d="M624 280H664"/><path class="rf-en-call" d="M792 280H832"/><text class="rf-en-label" x="32" y="500">HTML view or JSON response returns through the selected controller.</text>
</svg>
