<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="aa-en-title aa-en-desc">
  <title id="aa-en-title">Application architecture</title>
  <desc id="aa-en-desc">No deployment manifest exists; Gradle bootRun starts the single local process.</desc>
  <style>
    :root{--bg:#0d1117;--surface-a:#1b222c;--surface-b:#151b23;--lead-a:#222b38;--lead-b:#19202a;--inner:#1e2530;--inner-lead:#232c39;--line:#252d38;--line-lead:#33404f;--text:#f0f6fc;--body:#c3ccd6;--dim:#a2abb5;--faint:#8d959f;--accent:#7c9fff;--quiet:#78818c}
    .aa-en-bg{fill:var(--bg)} .aa-en-card{fill:url(#aa-en-surface);stroke:var(--line);stroke-width:1} .aa-en-lead{fill:url(#aa-en-lead);stroke:var(--line-lead);stroke-width:1} .aa-en-inner{fill:var(--inner);stroke:var(--line);stroke-width:1} .aa-en-inner-lead{fill:var(--inner-lead);stroke:var(--line-lead);stroke-width:1}
    .aa-en-title{font:600 20px "Pretendard",system-ui,sans-serif;fill:var(--text)} .aa-en-sub{font:400 13.5px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .aa-en-name{font:500 15px "Pretendard",system-ui,sans-serif;fill:var(--body)} .aa-en-label{font:400 13px "Pretendard",system-ui,sans-serif;fill:var(--dim)} .aa-en-value{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--faint)} .aa-en-badge{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--accent)}
    .aa-en-flow{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:aa-en-dash 2s linear infinite;marker-end:url(#aa-en-arrow)} .aa-en-call{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#aa-en-quiet-arrow)} .aa-en-branch{fill:none;stroke:var(--quiet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .aa-en-shadow{filter:url(#aa-en-shadow)} .aa-en-deep{filter:url(#aa-en-deep)} .aa-en-glow{filter:url(#aa-en-glow)} .aa-en-top{stroke:rgba(255,255,255,.05);stroke-width:1}
    @keyframes aa-en-dash{to{stroke-dashoffset:-22}} @media (prefers-reduced-motion:reduce){.aa-en-flow{animation:none}}
    @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--surface-a:#ffffff;--surface-b:#fafbfc;--lead-a:#ffffff;--lead-b:#f5f8ff;--inner:#eef1f4;--inner-lead:#e9f0fe;--line:#d8dee4;--line-lead:#b8c9ee;--text:#1f2328;--body:#3d444d;--dim:#59636e;--faint:#656d7a;--accent:#2f62d4;--quiet:#6e7781} .aa-en-shadow{filter:url(#aa-en-shadow-light)} .aa-en-deep{filter:url(#aa-en-deep-light)} .aa-en-glow{filter:url(#aa-en-glow-light)} .aa-en-top{display:none}}
  </style>
  <defs>
    <linearGradient id="aa-en-surface" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/></linearGradient>
    <linearGradient id="aa-en-lead" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/></linearGradient>
    <filter id="aa-en-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".50"/></filter>
    <filter id="aa-en-deep" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="aa-en-glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".40"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="aa-en-shadow-light" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-2" dy="6" stdDeviation="7" flood-color="#1f2328" flood-opacity=".13"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="aa-en-deep-light" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="-3" dy="9" stdDeviation="10" flood-color="#1f2328" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity=".10"/></filter>
    <filter id="aa-en-glow-light" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2f62d4" flood-opacity=".35"/><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2328" flood-opacity=".14"/></filter>
    <marker id="aa-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    <marker id="aa-en-quiet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/></marker>
  </defs>
  <rect class="aa-en-bg" width="960" height="540"/>
  <text class="aa-en-title" x="32" y="38">Application architecture</text>
  <text class="aa-en-sub" x="32" y="60">One Spring Boot process serves UI, REST, statistics, and ephemeral data</text>
  <g><rect class="aa-en-card aa-en-shadow" x="32" y="176" width="168" height="192" rx="12"/><path class="aa-en-top" d="M44 177H188"/><text class="aa-en-name" x="52" y="212">Clients</text><text class="aa-en-label" x="52" y="244">browser · JSON caller</text><text class="aa-en-value" x="52" y="274">HTTP :8090</text></g><g><rect class="aa-en-card aa-en-shadow" x="232" y="144" width="232" height="256" rx="12"/><path class="aa-en-top" d="M244 145H452"/><text class="aa-en-name" x="252" y="180">Web adapters</text><text class="aa-en-value" x="252" y="212">NoteController</text><text class="aa-en-label" x="252" y="242">NoteApiController · StatsController</text></g><g><rect class="aa-en-lead aa-en-deep aa-en-glow" x="496" y="144" width="200" height="256" rx="12"/><path class="aa-en-top" d="M508 145H684"/><text class="aa-en-name" x="516" y="180">Application services</text><text class="aa-en-value" x="516" y="212">NoteService</text><text class="aa-en-label" x="516" y="242">StatsService</text></g><g><rect class="aa-en-card aa-en-shadow" x="728" y="176" width="200" height="192" rx="12"/><path class="aa-en-top" d="M740 177H916"/><text class="aa-en-name" x="748" y="212">Persistence adapter</text><text class="aa-en-value" x="748" y="244">NoteRepository</text><text class="aa-en-label" x="748" y="274">Spring Data JPA</text></g><path class="aa-en-flow" d="M200 272H232"/><path class="aa-en-call" d="M464 272H496"/><path class="aa-en-flow" d="M696 272H728"/><rect class="aa-en-inner" x="760" y="280" width="136" height="64" rx="8"/><text class="aa-en-value" x="776" y="308">H2 memory</text><text class="aa-en-label" x="776" y="332">data.sql seed</text><text class="aa-en-label" x="32" y="500">No deployment manifest exists; Gradle bootRun starts the single local process.</text>
</svg>
