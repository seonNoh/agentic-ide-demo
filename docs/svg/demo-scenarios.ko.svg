  <g filter="url(#ds-ko-sh)"><rect class="ds-ko-card" x="248" y="160" width="192" height="224" rx="12"/><path class="ds-ko-top" d="M260 161H428"/><text class="ds-ko-name" x="268" y="200">Copilot</text><text class="ds-ko-label" x="268" y="224">네 가지 인터페이스</text><rect class="ds-ko-inner" x="268" y="248" width="152" height="34" rx="8"/><text class="ds-ko-label" x="282" y="269">Agent + Inline</text><rect class="ds-ko-inner" x="268" y="290" width="152" height="34" rx="8"/><text class="ds-ko-label" x="282" y="311">Cloud agent</text><text class="ds-ko-value" x="268" y="360">pinned 불리언</text></g>
  <g filter="url(#ds-ko-sh)"><rect class="ds-ko-card" x="464" y="160" width="192" height="224" rx="12"/><path class="ds-ko-top" d="M476 161H644"/><text class="ds-ko-name" x="484" y="200">Antigravity</text><text class="ds-ko-label" x="484" y="224">병렬 위임</text><rect class="ds-ko-inner" x="484" y="248" width="152" height="34" rx="8"/><text class="ds-ko-label" x="498" y="269">Manager View</text><rect class="ds-ko-inner" x="484" y="290" width="152" height="34" rx="8"/><text class="ds-ko-label" x="498" y="311">세 가지 작업</text><text class="ds-ko-value" x="484" y="360">DTO + 검색 + 문서</text></g>
