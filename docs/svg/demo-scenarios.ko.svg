<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ds-ko-title ds-ko-subtitle">
  <title id="ds-ko-title">에이전트형 IDE 비교 시나리오</title><desc id="ds-ko-subtitle">Four IDE workflows operate on the same note application.</desc>
  <style>.ds-ko-bg{fill:#0d1117}.ds-ko-card{fill:url(#ds-ko-s);stroke:#252d38;stroke-width:1}.ds-ko-lead{fill:url(#ds-ko-sl);stroke:#33404f;stroke-width:1}.ds-ko-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.ds-ko-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.ds-ko-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-ko-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.ds-ko-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-ko-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.ds-ko-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:ds-ko-dash 2s linear infinite}.ds-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes ds-ko-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.ds-ko-flow{animation:none}}</style>
  <defs><filter id="ds-ko-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><linearGradient id="ds-ko-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="ds-ko-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="ds-ko-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="ds-ko-text" x="32" y="38">에이전트형 IDE 비교 시나리오</text><text class="ds-ko-sub" x="32" y="58">하나의 노트 서비스 · 네 가지 에이전트 하네스</text>
