<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="gd-title gd-subtitle">
  <title id="gd-title">Gitea and GitHub repository roles</title><desc id="gd-subtitle">Gitea is the source repository and GitHub receives a push mirror.</desc>
  <style>.gd-bg{fill:#0d1117}.gd-card{fill:url(#gd-s);stroke:#252d38;stroke-width:1}.gd-lead{fill:url(#gd-sl);stroke:#33404f;stroke-width:1}.gd-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.gd-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.gd-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.gd-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.gd-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.gd-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.gd-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:gd-dash 2s linear infinite}.gd-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes gd-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.gd-flow{animation:none}}</style>
  <defs><filter id="gd-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="gd-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="gd-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="gd-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="gd-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="640" height="420" fill="#0d1117"/><text class="gd-text" x="32" y="38">Repository roles</text><text class="gd-sub" x="32" y="58">Gitea source · GitHub push mirror</text>
  <g filter="url(#gd-shl)"><rect class="gd-lead" x="32" y="112" width="240" height="208" rx="12"/><path class="gd-top" d="M44 113H260"/><text class="gd-text" x="56" y="152">Gitea</text><text class="gd-value" x="56" y="178">seon-labs/agentic-ide-demo</text><rect class="gd-inner" x="56" y="204" width="192" height="34" rx="8"/><text class="gd-label" x="70" y="225">source repository</text><rect class="gd-inner" x="56" y="246" width="192" height="34" rx="8"/><text class="gd-label" x="70" y="267">main · Kotlin</text></g>
  <path class="gd-flow" d="M272 216H368" marker-end="url(#gd-ta)"/>
  <g filter="url(#gd-sh)"><rect class="gd-card" x="368" y="112" width="240" height="208" rx="12"/><path class="gd-top" d="M380 113H596"/><text class="gd-name" x="392" y="152">GitHub</text><text class="gd-value" x="392" y="178">seonNoh/agentic-ide-demo</text><rect class="gd-inner" x="392" y="204" width="192" height="34" rx="8"/><text class="gd-label" x="406" y="225">push mirror · 8h</text><rect class="gd-inner" x="392" y="246" width="192" height="34" rx="8"/><text class="gd-label" x="406" y="267">main · read-only</text></g>
  <text class="gd-label" x="32" y="368">sync_on_commit=true</text><text class="gd-value" x="608" y="368" text-anchor="end">main → mirror</text>
</svg>
