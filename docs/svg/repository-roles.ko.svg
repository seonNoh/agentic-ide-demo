<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="gd-ko-title gd-ko-subtitle">
  <title id="gd-ko-title">Gitea와 GitHub 저장소 역할</title><desc id="gd-ko-subtitle">Gitea가 소스 저장소이고 GitHub가 push 미러를 받는다.</desc>
  <style>.gd-ko-bg{fill:#0d1117}.gd-ko-card{fill:url(#gd-ko-s);stroke:#252d38;stroke-width:1}.gd-ko-lead{fill:url(#gd-ko-sl);stroke:#33404f;stroke-width:1}.gd-ko-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.gd-ko-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.gd-ko-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.gd-ko-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.gd-ko-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.gd-ko-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.gd-ko-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:gd-ko-dash 2s linear infinite}.gd-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes gd-ko-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.gd-ko-flow{animation:none}}</style>
  <defs><filter id="gd-ko-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="gd-ko-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="gd-ko-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="gd-ko-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="gd-ko-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="640" height="420" fill="#0d1117"/><text class="gd-ko-text" x="32" y="38">저장소 역할</text><text class="gd-ko-sub" x="32" y="58">Gitea 소스 · GitHub push 미러</text>
  <g filter="url(#gd-ko-shl)"><rect class="gd-ko-lead" x="32" y="112" width="240" height="208" rx="12"/><path class="gd-ko-top" d="M44 113H260"/><text class="gd-ko-text" x="56" y="152">Gitea</text><text class="gd-ko-value" x="56" y="178">seon-labs/agentic-ide-demo</text><rect class="gd-ko-inner" x="56" y="204" width="192" height="34" rx="8"/><text class="gd-ko-label" x="70" y="225">소스 저장소</text><rect class="gd-ko-inner" x="56" y="246" width="192" height="34" rx="8"/><text class="gd-ko-label" x="70" y="267">main · Kotlin</text></g>
  <path class="gd-ko-flow" d="M272 216H368" marker-end="url(#gd-ko-ta)"/>
  <g filter="url(#gd-ko-sh)"><rect class="gd-ko-card" x="368" y="112" width="240" height="208" rx="12"/><path class="gd-ko-top" d="M380 113H596"/><text class="gd-ko-name" x="392" y="152">GitHub</text><text class="gd-ko-value" x="392" y="178">seonNoh/agentic-ide-demo</text><rect class="gd-ko-inner" x="392" y="204" width="192" height="34" rx="8"/><text class="gd-ko-label" x="406" y="225">push 미러 · 8시간</text><rect class="gd-ko-inner" x="392" y="246" width="192" height="34" rx="8"/><text class="gd-ko-label" x="406" y="267">main · 읽기 전용</text></g>
  <text class="gd-ko-label" x="32" y="368">sync_on_commit=true</text><text class="gd-ko-value" x="608" y="368" text-anchor="end">main → mirror</text>
</svg>
