  <g filter="url(#ds-ja-sh)"><rect class="ds-ja-card" x="248" y="160" width="192" height="224" rx="12"/><path class="ds-ja-top" d="M260 161H428"/><text class="ds-ja-name" x="268" y="200">Copilot</text><text class="ds-ja-label" x="268" y="224">4つのインターフェース</text><rect class="ds-ja-inner" x="268" y="248" width="152" height="34" rx="8"/><text class="ds-ja-label" x="282" y="269">Agent + Inline</text><rect class="ds-ja-inner" x="268" y="290" width="152" height="34" rx="8"/><text class="ds-ja-label" x="282" y="311">Cloud agent</text><text class="ds-ja-value" x="268" y="360">pinned boolean</text></g>
  <g filter="url(#ds-ja-sh)"><rect class="ds-ja-card" x="464" y="160" width="192" height="224" rx="12"/><path class="ds-ja-top" d="M476 161H644"/><text class="ds-ja-name" x="484" y="200">Antigravity</text><text class="ds-ja-label" x="484" y="224">並列委任</text><rect class="ds-ja-inner" x="484" y="248" width="152" height="34" rx="8"/><text class="ds-ja-label" x="498" y="269">Manager View</text><rect class="ds-ja-inner" x="484" y="290" width="152" height="34" rx="8"/><text class="ds-ja-label" x="498" y="311">3つのタスク</text><text class="ds-ja-value" x="484" y="360">DTO + search + docs</text></g>
