  <path class="ds-ja-flow" d="M224 412H680" marker-end="url(#ds-ja-ta)"/><text class="ds-ja-label" x="32" y="488">すべてのシナリオで同じ Kotlin 1.9 / Spring Boot 3.5 アプリケーションを使う</text><text class="ds-ja-value" x="928" y="488" text-anchor="end">1つのコードベース</text>
