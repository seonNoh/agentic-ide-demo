<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ds-ja-title ds-ja-subtitle">
  <title id="ds-ja-title">エージェント型 IDE の比較シナリオ</title><desc id="ds-ja-subtitle">Four IDE workflows operate on the same note application.</desc>
  <style>.ds-ja-bg{fill:#0d1117}.ds-ja-card{fill:url(#ds-ja-s);stroke:#252d38;stroke-width:1}.ds-ja-lead{fill:url(#ds-ja-sl);stroke:#33404f;stroke-width:1}.ds-ja-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.ds-ja-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.ds-ja-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-ja-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.ds-ja-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-ja-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.ds-ja-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:ds-ja-dash 2s linear infinite}.ds-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes ds-ja-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.ds-ja-flow{animation:none}}</style>
  <defs><filter id="ds-ja-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><linearGradient id="ds-ja-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="ds-ja-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="ds-ja-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="ds-ja-text" x="32" y="38">エージェント型 IDE の比較シナリオ</text><text class="ds-ja-sub" x="32" y="58">1つのノートサービス · 4つの異なるエージェントハーネス</text>
