<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="ds-title ds-subtitle">
  <title id="ds-title">Agentic IDE comparison scenarios</title><desc id="ds-subtitle">Four IDE workflows operate on the same note application.</desc>
  <style>.ds-bg{fill:#0d1117}.ds-card{fill:url(#ds-s);stroke:#252d38;stroke-width:1}.ds-lead{fill:url(#ds-sl);stroke:#33404f;stroke-width:1}.ds-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.ds-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.ds-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.ds-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.ds-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.ds-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:ds-dash 2s linear infinite}.ds-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes ds-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.ds-flow{animation:none}}</style>
  <defs><filter id="ds-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><linearGradient id="ds-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="ds-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="ds-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="ds-text" x="32" y="38">Agentic IDE comparison scenarios</text><text class="ds-sub" x="32" y="58">One note service · four distinct agent harnesses</text>
  <g filter="url(#ds-sh)"><rect class="ds-card" x="32" y="160" width="192" height="224" rx="12"/><path class="ds-top" d="M44 161H212"/><text class="ds-name" x="52" y="200">Kiro</text><text class="ds-label" x="52" y="224">spec-driven tag feature</text><rect class="ds-inner" x="52" y="248" width="152" height="34" rx="8"/><text class="ds-label" x="66" y="269">requirements</text><rect class="ds-inner" x="52" y="290" width="152" height="34" rx="8"/><text class="ds-label" x="66" y="311">design → code</text><text class="ds-value" x="52" y="360">requirements.md</text></g>
  <g filter="url(#ds-sh)"><rect class="ds-card" x="248" y="160" width="192" height="224" rx="12"/><path class="ds-top" d="M260 161H428"/><text class="ds-name" x="268" y="200">Copilot</text><text class="ds-label" x="268" y="224">four interfaces</text><rect class="ds-inner" x="268" y="248" width="152" height="34" rx="8"/><text class="ds-label" x="282" y="269">Agent + Inline</text><rect class="ds-inner" x="268" y="290" width="152" height="34" rx="8"/><text class="ds-label" x="282" y="311">Cloud agent</text><text class="ds-value" x="268" y="360">pinned boolean</text></g>
  <g filter="url(#ds-sh)"><rect class="ds-card" x="464" y="160" width="192" height="224" rx="12"/><path class="ds-top" d="M476 161H644"/><text class="ds-name" x="484" y="200">Antigravity</text><text class="ds-label" x="484" y="224">parallel delegation</text><rect class="ds-inner" x="484" y="248" width="152" height="34" rx="8"/><text class="ds-label" x="498" y="269">Manager View</text><rect class="ds-inner" x="484" y="290" width="152" height="34" rx="8"/><text class="ds-label" x="498" y="311">three tasks</text><text class="ds-value" x="484" y="360">DTO + search + docs</text></g>
  <g filter="url(#ds-sh)"><rect class="ds-lead" x="680" y="160" width="248" height="224" rx="12"/><path class="ds-top" d="M692 161H916"/><text class="ds-name" x="700" y="200">Junie</text><text class="ds-label" x="700" y="224">JVM refactoring modes</text><rect class="ds-inner" x="700" y="248" width="208" height="34" rx="8"/><text class="ds-label" x="714" y="269">Auto · Think · Brave</text><rect class="ds-inner" x="700" y="290" width="208" height="34" rx="8"/><text class="ds-label" x="714" y="311">service split</text><text class="ds-value" x="700" y="360">NoteQueryService</text></g>
  <path class="ds-flow" d="M224 412H680" marker-end="url(#ds-ta)"/><text class="ds-label" x="32" y="488">All scenarios share the same Kotlin 1.9 / Spring Boot 3.5 application</text><text class="ds-value" x="928" y="488" text-anchor="end">one codebase</text>
</svg>
