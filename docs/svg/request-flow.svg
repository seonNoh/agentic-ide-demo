<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rf-title rf-subtitle">
  <title id="rf-title">Note request flow</title><desc id="rf-subtitle">A note request moves through the controller, service, repository, and response.</desc>
  <style>.rf-bg{fill:#0d1117}.rf-card{fill:url(#rf-s);stroke:#252d38;stroke-width:1}.rf-lead{fill:url(#rf-sl);stroke:#33404f;stroke-width:1}.rf-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.rf-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.rf-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.rf-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.rf-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rf-dash 2s linear infinite}.rf-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes rf-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.rf-flow{animation:none}}</style>
  <defs><filter id="rf-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="rf-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="rf-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="rf-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="rf-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="rf-text" x="32" y="38">Note request flow</text><text class="rf-sub" x="32" y="58">The same domain model serves HTML pages and JSON clients</text>
  <g filter="url(#rf-sh)"><rect class="rf-card" x="32" y="176" width="184" height="168" rx="12"/><path class="rf-top" d="M44 177H204"/><text class="rf-name" x="52" y="216">Request</text><text class="rf-value" x="52" y="246">GET /api/notes</text><text class="rf-label" x="52" y="276">or form submit</text></g>
  <path class="rf-flow" d="M216 260H272" marker-end="url(#rf-ta)"/>
  <g filter="url(#rf-sh)"><rect class="rf-card" x="272" y="176" width="184" height="168" rx="12"/><path class="rf-top" d="M284 177H444"/><text class="rf-name" x="292" y="216">Controller</text><text class="rf-value" x="292" y="246">NoteApiController</text><text class="rf-label" x="292" y="276">validate and route</text></g>
  <path class="rf-flow" d="M456 260H512" marker-end="url(#rf-ta)"/>
  <g filter="url(#rf-shl)"><rect class="rf-lead" x="512" y="160" width="184" height="200" rx="12"/><path class="rf-top" d="M524 161H684"/><text class="rf-name" x="532" y="200">Service</text><text class="rf-value" x="532" y="230">NoteService</text><rect class="rf-inner" x="532" y="248" width="144" height="34" rx="8"/><text class="rf-label" x="546" y="269">domain rules</text><text class="rf-label" x="532" y="316">NoteRepository</text></g>
  <path class="rf-flow" d="M696 260H752" marker-end="url(#rf-ta)"/>
  <g filter="url(#rf-sh)"><rect class="rf-card" x="752" y="176" width="176" height="168" rx="12"/><path class="rf-top" d="M764 177H916"/><text class="rf-name" x="772" y="216">Response</text><text class="rf-value" x="772" y="246">JSON or HTML</text><text class="rf-label" x="772" y="276">H2-backed note</text></g>
  <text class="rf-label" x="32" y="488">Controller → service → repository keeps responsibilities explicit</text><text class="rf-value" x="928" y="488" text-anchor="end">JPA / H2</text>
</svg>
