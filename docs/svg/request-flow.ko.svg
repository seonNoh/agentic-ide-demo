<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rf-ko-title rf-ko-subtitle">
  <title id="rf-ko-title">노트 요청 흐름</title><desc id="rf-ko-subtitle">A note request moves through the controller, service, repository, and response.</desc>
  <style>.rf-ko-bg{fill:#0d1117}.rf-ko-card{fill:url(#rf-ko-s);stroke:#252d38;stroke-width:1}.rf-ko-lead{fill:url(#rf-ko-sl);stroke:#33404f;stroke-width:1}.rf-ko-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.rf-ko-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.rf-ko-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-ko-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.rf-ko-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-ko-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.rf-ko-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rf-ko-dash 2s linear infinite}.rf-ko-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes rf-ko-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.rf-ko-flow{animation:none}}</style>
  <defs><filter id="rf-ko-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="rf-ko-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="rf-ko-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="rf-ko-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="rf-ko-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="rf-ko-text" x="32" y="38">노트 요청 흐름</text><text class="rf-ko-sub" x="32" y="58">동일한 도메인 모델이 HTML 페이지와 JSON 클라이언트를 처리</text>
  <g filter="url(#rf-ko-sh)"><rect class="rf-ko-card" x="32" y="176" width="184" height="168" rx="12"/><path class="rf-ko-top" d="M44 177H204"/><text class="rf-ko-name" x="52" y="216">요청</text><text class="rf-ko-value" x="52" y="246">GET /api/notes</text><text class="rf-ko-label" x="52" y="276">or form submit</text></g>
  <path class="rf-ko-flow" d="M216 260H272" marker-end="url(#rf-ko-ta)"/>
  <g filter="url(#rf-ko-sh)"><rect class="rf-ko-card" x="272" y="176" width="184" height="168" rx="12"/><path class="rf-ko-top" d="M284 177H444"/><text class="rf-ko-name" x="292" y="216">컨트롤러</text><text class="rf-ko-value" x="292" y="246">NoteApi컨트롤러</text><text class="rf-ko-label" x="292" y="276">검증하고 전달</text></g>
  <path class="rf-ko-flow" d="M456 260H512" marker-end="url(#rf-ko-ta)"/>
  <g filter="url(#rf-ko-shl)"><rect class="rf-ko-lead" x="512" y="160" width="184" height="200" rx="12"/><path class="rf-ko-top" d="M524 161H684"/><text class="rf-ko-name" x="532" y="200">서비스</text><text class="rf-ko-value" x="532" y="230">Note서비스</text><rect class="rf-ko-inner" x="532" y="248" width="144" height="34" rx="8"/><text class="rf-ko-label" x="546" y="269">도메인 규칙</text><text class="rf-ko-label" x="532" y="316">NoteRepository</text></g>
  <path class="rf-ko-flow" d="M696 260H752" marker-end="url(#rf-ko-ta)"/>
  <g filter="url(#rf-ko-sh)"><rect class="rf-ko-card" x="752" y="176" width="176" height="168" rx="12"/><path class="rf-ko-top" d="M764 177H916"/><text class="rf-ko-name" x="772" y="216">응답</text><text class="rf-ko-value" x="772" y="246">JSON 또는 HTML</text><text class="rf-ko-label" x="772" y="276">H2 기반 노트</text></g>
  <text class="rf-ko-label" x="32" y="488">컨트롤러 → service → repository keeps responsibilities explicit</text><text class="rf-ko-value" x="928" y="488" text-anchor="end">JPA / H2</text>
</svg>
