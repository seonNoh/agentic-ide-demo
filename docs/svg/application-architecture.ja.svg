<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="aa-ja-title aa-ja-subtitle">
  <title id="aa-ja-title">Agentic IDE デモアプリケーション構成</title>
  <desc id="aa-ja-subtitle">A browser reaches Spring Boot controllers, services, and the H2 note database.</desc>
  <style>
    .aa-ja-bg{fill:#0d1117}.aa-ja-card{fill:url(#aa-ja-s);stroke:#252d38;stroke-width:1}.aa-ja-lead{fill:url(#aa-ja-sl);stroke:#33404f;stroke-width:1}.aa-ja-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.aa-ja-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.aa-ja-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.aa-ja-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.aa-ja-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.aa-ja-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.aa-ja-badge{font:400 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7c9fff}.aa-ja-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:aa-ja-dash 2s linear infinite}.aa-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}.aa-ja-glow{filter:url(#aa-ja-gl)}
    @keyframes aa-ja-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.aa-ja-flow{animation:none}}
  </style>
  <defs>
    <filter id="aa-ja-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="aa-ja-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter>
    <filter id="aa-ja-gl" x="-60%" y="-90%" width="220%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c9fff" flood-opacity=".4"/><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".45"/></filter>
    <linearGradient id="aa-ja-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient>
    <linearGradient id="aa-ja-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient>
    <marker id="aa-ja-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker>
  </defs>
  <rect width="960" height="540" fill="#0d1117"/>
  <text class="aa-ja-text" x="32" y="38">Agentic IDE デモアプリケーション構成</text>
  <text class="aa-ja-sub" x="32" y="58">Spring Boot MVC · REST API · H2 インメモリ永続化</text>
  <g filter="url(#aa-ja-sh)"><rect class="aa-ja-card" x="32" y="144" width="200" height="240" rx="12"/><path class="aa-ja-top" d="M44 145H220"/><text class="aa-ja-name" x="56" y="180">ブラウザ</text><text class="aa-ja-label" x="56" y="208">ユーザー向け入口</text><rect class="aa-ja-inner" x="56" y="232" width="152" height="34" rx="8"/><text class="aa-ja-label" x="70" y="253">Thymeleaf ページ</text><rect class="aa-ja-inner" x="56" y="274" width="152" height="34" rx="8"/><text class="aa-ja-label" x="70" y="295">JSON リクエスト</text><text class="aa-ja-badge" x="56" y="360">ポート 8090</text></g>
  <path class="aa-ja-flow" d="M232 264H280" marker-end="url(#aa-ja-ta)"/>
  <g filter="url(#aa-ja-shl)"><rect class="aa-ja-lead aa-ja-glow" x="280" y="128" width="240" height="272" rx="12"/><path class="aa-ja-top" d="M292 129H508"/><text class="aa-ja-text" x="304" y="168">Spring Boot</text><text class="aa-ja-sub" x="304" y="188">コントローラとサービス</text><rect class="aa-ja-inner" x="304" y="216" width="192" height="34" rx="8"/><text class="aa-ja-label" x="318" y="237">NoteController</text><rect class="aa-ja-inner" x="304" y="258" width="192" height="34" rx="8"/><text class="aa-ja-label" x="318" y="279">NoteApiController</text><rect class="aa-ja-inner" x="304" y="300" width="192" height="34" rx="8"/><text class="aa-ja-label" x="318" y="321">NoteService</text><text class="aa-ja-badge" x="304" y="368">KOTLIN 1.9</text></g>
  <path class="aa-ja-flow" d="M520 264H568" marker-end="url(#aa-ja-ta)"/>
  <g filter="url(#aa-ja-sh)"><rect class="aa-ja-card" x="568" y="96" width="360" height="336" rx="12"/><path class="aa-ja-top" d="M584 97H912"/><text class="aa-ja-name" x="592" y="132">永続化と統計</text><rect class="aa-ja-inner" x="592" y="184" width="312" height="88" rx="8"/><text class="aa-ja-name" x="612" y="214">NoteRepository</text><text class="aa-ja-label" x="612" y="238">Spring Data JPA</text><text class="aa-ja-value" x="612" y="258">Note(title, content, createdAt)</text><rect class="aa-ja-inner" x="592" y="296" width="312" height="88" rx="8"/><text class="aa-ja-name" x="612" y="326">H2 データベース</text><text class="aa-ja-label" x="612" y="350">data.sql のシードノート</text><text class="aa-ja-label" x="612" y="370">StatsService → /api/stats</text></g>
  <text class="aa-ja-label" x="32" y="488">1つの JVM コードベース · 4つの IDE ワークフロー · 1つのノートドメイン</text><text class="aa-ja-value" x="928" y="488" text-anchor="end">Spring Boot 3.5</text>
</svg>
