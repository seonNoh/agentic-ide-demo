<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="rf-ja-title rf-ja-subtitle">
  <title id="rf-ja-title">ノートのリクエストフロー</title><desc id="rf-ja-subtitle">ノートのリクエストがコントローラ、サービス、リポジトリ、レスポンスを順に通過する。</desc>
  <style>.rf-ja-bg{fill:#0d1117}.rf-ja-card{fill:url(#rf-ja-s);stroke:#252d38;stroke-width:1}.rf-ja-lead{fill:url(#rf-ja-sl);stroke:#33404f;stroke-width:1}.rf-ja-inner{fill:#1e2530;stroke:#252d38;stroke-width:1}.rf-ja-text{font:600 16px Pretendard,system-ui,sans-serif;fill:#f0f6fc}.rf-ja-sub{font:400 11.5px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-ja-name{font:500 13px Pretendard,system-ui,sans-serif;fill:#c3ccd6}.rf-ja-label{font:400 11px Pretendard,system-ui,sans-serif;fill:#939da8}.rf-ja-value{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#69717a}.rf-ja-flow{fill:none;stroke:#7c9fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:rf-ja-dash 2s linear infinite}.rf-ja-top{stroke:rgba(255,255,255,.05);stroke-width:1}@keyframes rf-ja-dash{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion:reduce){.rf-ja-flow{animation:none}}</style>
  <defs><filter id="rf-ja-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".5"/></filter><filter id="rf-ja-shl" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="#000" flood-opacity=".58"/></filter><linearGradient id="rf-ja-s" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#1b222c"/><stop offset="1" stop-color="#151b23"/></linearGradient><linearGradient id="rf-ja-sl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#222b38"/><stop offset="1" stop-color="#19202a"/></linearGradient><marker id="rf-ja-ta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7c9fff"/></marker></defs>
  <rect width="960" height="540" fill="#0d1117"/><text class="rf-ja-text" x="32" y="38">ノートのリクエストフロー</text><text class="rf-ja-sub" x="32" y="58">同じドメインモデルで HTML ページと JSON クライアントを処理する</text>
  <g filter="url(#rf-ja-sh)"><rect class="rf-ja-card" x="32" y="176" width="184" height="168" rx="12"/><path class="rf-ja-top" d="M44 177H204"/><text class="rf-ja-name" x="52" y="216">リクエスト</text><text class="rf-ja-value" x="52" y="246">GET /api/notes</text><text class="rf-ja-label" x="52" y="276">またはフォーム送信</text></g>
  <path class="rf-ja-flow" d="M216 260H272" marker-end="url(#rf-ja-ta)"/>
  <g filter="url(#rf-ja-sh)"><rect class="rf-ja-card" x="272" y="176" width="184" height="168" rx="12"/><path class="rf-ja-top" d="M284 177H444"/><text class="rf-ja-name" x="292" y="216">コントローラ</text><text class="rf-ja-value" x="292" y="240">NoteController</text><text class="rf-ja-value" x="292" y="258">NoteApiController</text><text class="rf-ja-label" x="292" y="286">検証して振り分ける</text></g>
  <path class="rf-ja-flow" d="M456 260H512" marker-end="url(#rf-ja-ta)"/>
  <g filter="url(#rf-ja-shl)"><rect class="rf-ja-lead" x="512" y="160" width="184" height="200" rx="12"/><path class="rf-ja-top" d="M524 161H684"/><text class="rf-ja-name" x="532" y="200">サービス</text><text class="rf-ja-value" x="532" y="230">NoteService</text><rect class="rf-ja-inner" x="532" y="248" width="144" height="34" rx="8"/><text class="rf-ja-label" x="546" y="269">ドメインルール</text><text class="rf-ja-label" x="532" y="316">NoteRepository</text></g>
  <path class="rf-ja-flow" d="M696 260H752" marker-end="url(#rf-ja-ta)"/>
  <g filter="url(#rf-ja-sh)"><rect class="rf-ja-card" x="752" y="176" width="176" height="168" rx="12"/><path class="rf-ja-top" d="M764 177H916"/><text class="rf-ja-name" x="772" y="216">レスポンス</text><text class="rf-ja-value" x="772" y="246">JSON または HTML</text><text class="rf-ja-label" x="772" y="276">H2 ベースのノート</text></g>
  <text class="rf-ja-label" x="32" y="488">コントローラ → サービス → リポジトリで責務を明確にする</text><text class="rf-ja-value" x="928" y="488" text-anchor="end">JPA / H2</text>
</svg>
