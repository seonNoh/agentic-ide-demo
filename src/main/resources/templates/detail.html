<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${note.title})}"></head>
<body class="bg-slate-50 min-h-screen">
<nav th:replace="~{fragments/header :: nav}"></nav>

<main class="max-w-3xl mx-auto px-6 py-10">
  <a href="/" class="text-sm text-slate-500 hover:text-slate-700">← Back</a>

  <article th:classappend="${'card-border-' + note.color}"
           class="bg-white rounded-2xl shadow-sm border border-slate-200 border-l-4 p-10 mt-4">
    <h1 class="text-4xl font-bold text-slate-900 leading-tight" th:text="${note.title}">title</h1>
    <div class="text-xs text-slate-400 mt-3 flex items-center gap-3">
      <span>created <span th:text="${#temporals.format(note.createdAt, 'yyyy-MM-dd HH:mm')}">created</span></span>
      <span>·</span>
      <span>updated <span th:text="${#temporals.format(note.updatedAt, 'yyyy-MM-dd HH:mm')}">updated</span></span>
      <span class="ml-auto px-2 py-0.5 bg-slate-100 rounded-full text-slate-500" th:text="${note.color}">color</span>
    </div>
    <div class="mt-8 text-slate-700 leading-relaxed whitespace-pre-wrap" th:text="${note.content}">content</div>
  </article>

  <form th:action="@{|/notes/${note.id}/delete|}" method="post" class="mt-6">
    <button type="submit"
            class="text-sm font-medium text-rose-600 hover:text-rose-700"
            onclick="return confirm('Delete this note?')">
      Delete this note
    </button>
  </form>
</main>
</body>
</html>
