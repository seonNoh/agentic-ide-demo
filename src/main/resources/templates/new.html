<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('New Note')}"></head>
<body class="bg-slate-50 min-h-screen">
<nav th:replace="~{fragments/header :: nav}"></nav>

<main class="max-w-2xl mx-auto px-6 py-10">
  <h1 class="text-3xl font-bold text-slate-900 mb-2">New Note</h1>
  <p class="text-slate-500 mb-8">Create a new note.</p>

  <form th:action="@{/notes}" th:object="${form}" method="post"
        class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6">

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1.5">Title</label>
      <input type="text" th:field="*{title}"
             placeholder="Note title"
             class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
      <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-sm text-rose-600 mt-1.5"></p>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1.5">Content</label>
      <textarea th:field="*{content}" rows="8"
                placeholder="Write something..."
                class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
      <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-sm text-rose-600 mt-1.5"></p>
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1.5">Color</label>
      <select th:field="*{color}"
              class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="slate">Slate</option>
        <option value="indigo">Indigo</option>
        <option value="emerald">Emerald</option>
        <option value="amber">Amber</option>
        <option value="rose">Rose</option>
        <option value="sky">Sky</option>
      </select>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 shadow-sm transition">
        Save
      </button>
      <a href="/" class="px-6 py-2.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition">
        Cancel
      </a>
    </div>

  </form>
</main>
</body>
</html>
